name: RECAP CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'imports/**'
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Import RECAP source"]
    types: [completed]

permissions:
  contents: read

jobs:
  scanner-tests:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - name: Install scanner dependencies
        run: python -m pip install -r scanner/requirements.txt pytest
      - name: Test 12 scanner scenarios
        run: PYTHONPATH=. python -m pytest tests/test_analyzer.py tests/test_session_store.py -v
      - name: Compile Python files
        run: python -m compileall -q scanner

  frontend-build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend packages
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: TypeScript check + Vite build
        working-directory: frontend
        env:
          VITE_ENABLE_DEMO: 'false'
        run: npm run build

  backend-typecheck:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend packages
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Type-check Cloudflare Worker
        working-directory: backend
        run: npm run typecheck

  source-zip:
    name: RECAP v2 source ZIP
    if: github.event_name == 'pull_request'
    needs: [scanner-tests, frontend-build, backend-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source ZIP
        run: |
          zip -q -r RECAP-v2-source.zip frontend backend scanner shared tests docs .github README.md CHATGPT_INSTRUCTIONS.md .gitignore -x '*/node_modules/*' '*/__pycache__/*' '*.pyc' '*.env' '*.dev.vars'
      - uses: actions/upload-artifact@v4
        with:
          name: RECAP-v2-source
          path: RECAP-v2-source.zip
          retention-days: 30
