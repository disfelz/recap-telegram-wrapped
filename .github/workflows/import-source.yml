name: Import RECAP source

on:
  push:
    branches: [main]
    paths:
      - 'imports/RECAP_v1.1_audited_patch.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recap-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify and extract supplied archive safely
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat, zipfile

          archive = Path("imports/RECAP_v1.1_audited_patch.zip")
          if not archive.exists():
              raise SystemExit("Missing imports/RECAP_v1.1_audited_patch.zip")
          required = {
              "CHATGPT_INSTRUCTIONS.md",
              "frontend/package.json",
              "frontend/src/App.tsx",
              "backend/package.json",
              "backend/src/index.ts",
              "scanner/app/analyzer.py",
              "scanner/requirements.txt",
              "tests/test_analyzer.py",
          }
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f"Missing required source files: {sorted(missing)}")
              if len(names) > 300 or sum(x.file_size for x in z.infolist()) > 5_000_000:
                  raise SystemExit("Archive exceeds RECAP import limits")
              for info in z.infolist():
                  name = PurePosixPath(info.filename)
                  parts = name.parts
                  if name.is_absolute() or not parts or any(p in ('', '.', '..') for p in parts):
                      raise SystemExit(f"Unsafe ZIP entry: {info.filename}")
                  if (info.external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                      raise SystemExit(f"Symlinks not allowed: {info.filename}")
                  if info.is_dir():
                      continue
                  if parts[0] in ("imports", ".git") or "__pycache__" in parts or ".pytest_cache" in parts:
                      continue
                  if any(p.startswith(".env") and p not in (".env.example",) for p in parts):
                      continue
                  # Never enable the original auto-deploy workflow.
                  if info.filename == ".github/workflows/deploy.yml":
                      continue
                  if parts[0] == ".github" and info.filename.startswith(".github/workflows/"):
                      continue
                  dest = Path(*parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(info))
          print("RECAP source extracted; deploy workflow explicitly excluded.")
          PY
      - name: Replace upload with verified source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f imports/RECAP_v1.1_audited_patch.zip
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import."
            exit 0
          fi
          git commit -m 'build: import RECAP v1.1 sources (deployment disabled)'
          git push origin HEAD:main
