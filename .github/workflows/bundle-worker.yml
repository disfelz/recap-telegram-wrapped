name: Bundle RECAP Worker for Cloudflare release

on:
  push:
    branches: [recap-v2]
    paths:
      - '.github/workflows/bundle-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recap-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle production Cloudflare Worker
        run: |
          npx --yes esbuild@0.25.12 backend/src/index.ts \
            --bundle --format=esm --platform=browser --target=es2022 \
            --minify --outfile=backend/release/worker.mjs
          test -s backend/release/worker.mjs
          grep -q 'scanner/callback' backend/release/worker.mjs
      - name: Commit generated Worker module to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/release/worker.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build: bundle RECAP v2 Worker for managed deployment"
            git push origin HEAD:recap-v2
          fi
