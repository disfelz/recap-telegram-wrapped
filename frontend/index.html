<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090F" />
    <meta name="description" content="RECAP — твоя персональная статистика сообщений Telegram за год. Твои сообщения, твоя история." />
    <title>RECAP — Твой год в Telegram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        var app = window.Telegram && window.Telegram.WebApp;
        if (!app) return;
        try { app.ready(); } catch (e) {}
        try { app.expand(); } catch (e) {}
        try { if (app.requestFullscreen) app.requestFullscreen(); } catch (e) {}
        try { if (app.disableVerticalSwipes) app.disableVerticalSwipes(); } catch (e) {}
        try { if (app.setHeaderColor) app.setHeaderColor('#09090F'); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
